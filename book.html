<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a demo – Tcipher Technologies</title>
<meta name="description" content="Pick a time for a free demo call with Tcipher Technologies.">
<meta name="robots" content="noindex">
<style>
:root{--bg:#F7F7FC;--card:#fff;--ink:#1D1B2E;--ink2:#55526B;--ink3:#7F7C96;--line:#E4E4F2;--pri:#6450F5;--pri-ink:#fff;--soft:#EFEDFF;--bad:#C2362B;--ok:#1F8A4C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121120;--card:#1B1A2B;--ink:#F1F0FA;--ink2:#C3C0D8;--ink3:#8F8BA8;--line:#2E2C44;--pri:#8B7BFF;--pri-ink:#120F2E;--soft:#26224A;--bad:#FF8A7E;--ok:#5FD08F}}
:root[data-theme="dark"]{--bg:#121120;--card:#1B1A2B;--ink:#F1F0FA;--ink2:#C3C0D8;--ink3:#8F8BA8;--line:#2E2C44;--pri:#8B7BFF;--pri-ink:#120F2E;--soft:#26224A;--bad:#FF8A7E;--ok:#5FD08F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:32px 16px 56px}
.brand{font-weight:700;letter-spacing:-.01em;font-size:18px;color:var(--ink)}
.brand span{color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px clamp(16px,4vw,32px);margin-top:16px}
h1{font-size:clamp(24px,5vw,30px);line-height:1.2;margin:0 0 6px;letter-spacing:-.015em}
.sub{color:var(--ink2);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink3);font-size:14px;margin-top:10px}
h2{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:22px 0 8px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.day{flex:none;scroll-snap-align:start;min-width:76px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.day b{display:block;font-size:15px}.day small{color:var(--ink3);font-size:12.5px}
.day[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}.day[aria-pressed="true"] small{color:inherit;opacity:.85}
.day:disabled{opacity:.45;cursor:default}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.time{padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.time:hover{border-color:var(--pri)}.time[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2);font-weight:500}
label.full{grid-column:1/-1}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:72px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.picked{grid-column:1/-1;background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.picked b{font-size:16px}.picked button{margin-left:auto}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:12px 18px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--pri);padding:6px 10px;border-color:transparent}
.btn:disabled{opacity:.6;cursor:default}
.actions{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.err{color:var(--bad);margin:0;font-size:14.5px}
.muted{color:var(--ink3);font-size:14px}
.empty{color:var(--ink2);padding:8px 0}
.done{text-align:left}
.done .tick{width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:24px;margin-bottom:12px}
.skeleton{height:44px;border-radius:10px;background:var(--line);opacity:.5}
@media (max-width:520px){form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.time,.day{transition:background-color .12s,border-color .12s,color .12s}}
</style></head>
<body><main>
<div class="brand">t<span>cipher</span></div>
<div class="card" id="app" aria-live="polite">
  <h1>Book a demo</h1>
  <p class="sub">Loading free times…</p>
</div>
<p class="muted" style="margin-top:14px">Times are in India time (IST). Your details are used only to arrange this call. <a href="privacy.html" style="color:var(--pri)">Privacy</a></p>
</main>
<script>
(() => {
  // the workspace's Supabase project; the publishable key is public by design
  const API = "https://pfdnziybqaumnofjknsj.supabase.co/functions/v1/google-sync";
  const KEY = "sb_publishable_pqodY5Y9HWb0dsYTJy4CnA_c6nzCJ1q";
  const app = document.getElementById("app");
  const lead = (new URLSearchParams(location.search).get("lead") || "").trim();
  const st = { data: null, day: null, time: null, sending: false };

  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (k === "text") n.textContent = v; else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
    return n;
  };
  const call = async (body) => {
    const res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", apikey: KEY }, body: JSON.stringify(body) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || j.error) { const e = new Error(j.error || "Something went wrong. Please try again."); e.status = res.status; throw e; }
    return j;
  };
  const dayLabel = (d, long) => new Date(d + "T12:00:00").toLocaleDateString("en-IN", long ? { weekday: "long", day: "numeric", month: "long" } : { weekday: "short", day: "numeric", month: "short" });
  const timeLabel = t => { const [h, m] = t.split(":").map(Number); return ((h % 12) || 12) + ":" + String(m).padStart(2, "0") + (h < 12 ? " am" : " pm"); };
  const endLabel = (t, mins) => { const [h, m] = t.split(":").map(Number); const n = h * 60 + m + mins; return timeLabel(String(Math.floor(n / 60)).padStart(2, "0") + ":" + String(n % 60).padStart(2, "0")); };

  async function load(keep){
    try { st.data = await call({ action: "public_slots", lead }); }
    catch (e) { app.replaceChildren(el("h1", { text: "Book a demo" }), el("p", { class: "err", text: "Couldn’t load free times. Please refresh the page." })); return; }
    if (!keep || !st.data.days.some(d => d.day === st.day && d.times.includes(st.time))) { st.time = null; }
    if (!st.day || !st.data.days.some(d => d.day === st.day && d.times.length)) st.day = (st.data.days.find(d => d.times.length) || {}).day || null;
    draw();
  }
  function head(){
    const D = st.data;
    return [el("h1", { text: "Book a demo with " + (D.company || "us") }),
      el("p", { class: "sub", text: "Pick a time that suits you. We’ll show you what we can build for you and answer your questions." }),
      el("div", { class: "meta" }, el("span", { text: "🕒 " + D.minutes + " minutes" }), el("span", { text: "📹 Google Meet" }), el("span", { text: "🌏 " + D.timezone }))];
  }
  function draw(){
    const D = st.data;
    if (!D.open) { app.replaceChildren(el("h1", { text: "Book a demo" }), el("p", { class: "sub", text: "Online booking is closed right now. Please reply to our email or message us on WhatsApp, and we’ll find a time." })); return; }
    const withTimes = D.days.filter(d => d.times.length);
    if (!withTimes.length) { app.replaceChildren(...head(), el("p", { class: "empty", text: "No free times in the coming days. Please reply to our email and we’ll find a time." })); return; }
    const days = el("div", { class: "days", role: "group", "aria-label": "Day" }, D.days.map(d => el("button", { type: "button", class: "day", disabled: !d.times.length, "aria-pressed": String(st.day === d.day),
      onclick: () => { st.day = d.day; st.time = null; draw(); } }, el("b", { text: dayLabel(d.day).split(" ").slice(0, 1).join(" ").replace(",", "") }), el("small", { text: dayLabel(d.day).split(" ").slice(1).join(" ") + (d.times.length ? "" : " · full") }))));
    const cur = D.days.find(d => d.day === st.day);
    const times = el("div", { class: "times", role: "group", "aria-label": "Time" }, (cur ? cur.times : []).map(t => el("button", { type: "button", class: "time", "aria-pressed": String(st.time === t),
      onclick: () => { st.time = t; draw(); setTimeout(() => { const f = document.getElementById("f-name"); if (f) { f.scrollIntoView({ behavior: "smooth", block: "center" }); f.focus({ preventScroll: true }); } }, 50); } }, timeLabel(t))));
    const parts = [...head(), el("h2", { text: "Day" }), days, el("h2", { text: cur ? dayLabel(cur.day, true) : "Time" }), times];
    if (st.time) parts.push(el("h2", { text: "Your details" }), detailsForm());
    app.replaceChildren(...parts);
  }
  function detailsForm(){
    const L = st.data.lead || {};
    const f = (id, label, type, val, opts) => el("label", { class: (opts && opts.full) ? "full" : null, for: id }, label,
      type === "textarea" ? el("textarea", { id, name: id, rows: "3", placeholder: (opts && opts.ph) || null }) : el("input", { id, name: id, type, value: val || "", required: opts && opts.req, autocomplete: (opts && opts.ac) || null, placeholder: (opts && opts.ph) || null }));
    const err = el("p", { class: "err", hidden: true, role: "alert" });
    const btn = el("button", { type: "submit", class: "btn" }, "Book " + timeLabel(st.time));
    const form = el("form", { novalidate: true, onsubmit: async e => {
      e.preventDefault(); if (st.sending) return;
      const v = id => (form.querySelector("#" + id) || {}).value || "";
      if (v("f-name").trim().length < 2) return show("Please enter your name.", "f-name");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v("f-email").trim())) return show("Please enter a valid email address. The invite goes there.", "f-email");
      st.sending = true; btn.disabled = true; btn.textContent = "Booking…"; err.hidden = true;
      try {
        const r = await call({ action: "public_book", lead, day: st.day, time: st.time, name: v("f-name"), email: v("f-email"), phone: v("f-phone"), company: v("f-company"), note: v("f-note"), website: v("f-website") });
        done(r, v("f-email").trim());
      } catch (ex) {
        st.sending = false;
        if (ex.status === 409) { await load(false); const e2 = app.querySelector("h2"); show(ex.message); if (e2) app.insertBefore(err, e2); return; }
        btn.disabled = false; btn.textContent = "Book " + timeLabel(st.time); show(ex.message);
      }
      function show(msg, focusId){ err.textContent = msg; err.hidden = false; if (focusId) form.querySelector("#" + focusId).focus(); }
    } },
      el("div", { class: "picked" }, el("b", { text: dayLabel(st.day) + ", " + timeLabel(st.time) + " – " + endLabel(st.time, st.data.minutes) }), el("span", { class: "muted", text: "IST" }),
        el("button", { type: "button", class: "btn ghost", onclick: () => { st.time = null; draw(); } }, "Change")),
      f("f-name", "Your name", "text", L.name, { req: true, ac: "name" }),
      f("f-email", "Email (for the invite)", "email", L.email, { req: true, ac: "email" }),
      f("f-phone", "Phone / WhatsApp (optional)", "tel", L.phone, { ac: "tel" }),
      f("f-company", "Company (optional)", "text", L.company, { ac: "organization" }),
      f("f-note", "What would you like to see? (optional)", "textarea", "", { full: true, ph: "e.g. an ordering app for our 3 restaurants" }),
      el("div", { class: "hp", "aria-hidden": "true" }, el("label", { for: "f-website" }, "Website", el("input", { id: "f-website", name: "website", type: "text", tabindex: "-1", autocomplete: "off" }))),
      el("div", { class: "actions" }, btn), err);
    return form;
  }
  function done(r, email){
    app.replaceChildren(el("div", { class: "done" }, el("div", { class: "tick", "aria-hidden": "true", text: "✓" }),
      el("h1", { text: "You’re booked" }),
      el("p", { class: "sub" }, el("b", { text: dayLabel(r.day, true) + ", " + timeLabel(r.time) + " – " + endLabel(r.time, r.minutes) + " IST" }), r.with ? " with " + r.with + "." : "."),
      el("p", { class: "sub", text: r.invited ? "A Google Calendar invite with the Meet link is on its way to " + email + "." : "We’ll email the meeting link to " + email + " shortly." }),
      r.link ? el("p", {}, el("a", { href: r.link, target: "_blank", rel: "noopener", style: "color:var(--pri);font-weight:600" }, "Meeting link")) : null,
      el("p", { class: "muted", text: "Need to change the time? Reply to the invite and we’ll sort it out." })));
    app.focus && app.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  load(false);
})();
</script>
</body></html>
